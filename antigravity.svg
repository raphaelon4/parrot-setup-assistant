<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#f5576c" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Outer orbital ring 1 -->
  <ellipse cx="128" cy="128" rx="88" ry="34" fill="none" stroke="url(#orbitGrad1)" stroke-width="4.5" transform="rotate(-30 128 128)" opacity="0.85" filter="url(#glow)" />

  <!-- Outer orbital ring 2 -->
  <ellipse cx="128" cy="128" rx="88" ry="34" fill="none" stroke="url(#orbitGrad2)" stroke-width="4.5" transform="rotate(35 128 128)" opacity="0.85" filter="url(#glow)" />

  <!-- Central floating core / portal -->
  <circle cx="128" cy="128" r="38" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="128" cy="128" r="28" fill="#0f172a" />
  
  <!-- Stylized Anti-Gravity Delta Symbol -->
  <path d="M128 106 L144 142 L112 142 Z" fill="url(#orbitGrad1)" />
  <circle cx="128" cy="125" r="4" fill="#ffffff" />

  <!-- Orbiting Quantum Nodes -->
  <circle cx="196" cy="90" r="6" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="60" cy="166" r="6" fill="#f093fb" filter="url(#glow)" />
  <circle cx="178" cy="172" r="5" fill="#38bdf8" filter="url(#glow)" />
</svg>
